# safety_config.yaml
# Live safety configuration for ros-llm-toolkit. The Safety Layer reads this file on every
# tool call: velocity clamping (velocity_limits), workspace-bounds enforcement (workspace_bounds),
# the confirmation gate (confirmation_required), and the command audit log (logging).
# Edit these values freely — changes take effect on the next tool call. Code never writes here.

velocity_limits:
  linear_x:
    max: 0.5      # m/s — hard ceiling
    min: -0.5
  angular_z:
    max: 1.0      # rad/s
    min: -1.0

confirmation_required:
  - /robot/emergency_stop
  - /robot/arm/move_to_pose              # placeholder for future

workspace_bounds:
  x: [-5.0, 5.0]   # metres from origin
  y: [-5.0, 5.0]

logging:
  enabled: true
  path: logs/commands.log
  format: "[{timestamp}] {tool} | {args} | {outcome}"
